name: Bootstrap Gradle wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle 8.10.2 wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version
      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: add Gradle 8.10.2 wrapper"
            git push
          fi
