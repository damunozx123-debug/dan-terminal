name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify or bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::notice::Wrapper files missing in checked-out commit; generating Gradle 8.10.2 wrapper"
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify launchable activity in packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK/build-tools"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          LAUNCHER="$(printf '%s\n' "$BADGING" | grep '^launchable-activity:' || true)"
          echo "APK launcher declaration: $LAUNCHER"
          [[ "$LAUNCHER" == *"name='com.dan.terminal.MainActivity'"* ]] || {
            echo "::error::APK does not expose DAN Terminal's MAIN/LAUNCHER activity"
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
