name: Android CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop, 'fix/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: python3 scripts/validate_source_tree.py
      - name: Check bootstrap script
        run: bash -n scripts/bootstrap_gradle_wrapper.sh app/src/main/assets/bootstrap/dan_bootstrap.sh
      - name: Test bootstrap success and failure
        run: python3 scripts/test_bootstrap.py
      - name: Check whitespace
        run: git diff --check

  build:
    # Linux runner has no /dev/kvm; run Android emulator acceptance on accelerated macOS.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # v3 asks sdkmanager for the retired "tools" package and fails before build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Generate checksum-verified Gradle wrapper
        run: bash scripts/bootstrap_gradle_wrapper.sh

      - name: Upload verified Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

      - name: Compile and unit test
        run: ./gradlew :app:assembleDebug testDebugUnitTest lintDebug --continue --stacktrace --no-daemon

      - name: Verify side-by-side development package
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/dan-apk-badging.txt"
          grep -Fq "package: name='com.dan.terminal.dev' " "$RUNNER_TEMP/dan-apk-badging.txt"
          grep -Fq "application-label:'DAN Terminal Dev'" "$RUNNER_TEMP/dan-apk-badging.txt"
          grep -Fq "launchable-activity: name='com.dan.terminal.MainActivity'" "$RUNNER_TEMP/dan-apk-badging.txt"

      - name: Run PTY acceptance test on Android 16 emulator
        id: acceptance
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: dan-api36-first
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/run_android_acceptance.sh

      - name: Classify emulator startup failure
        id: boot_failure
        if: steps.acceptance.outcome == 'failure'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/dan-terminal-emulator-diagnostics/tests-started" ]]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "Instrumentation started; preserving test failure."
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Instrumentation never started; retrying a fresh emulator once."
          fi

      - name: Retry emulator startup once
        id: acceptance_retry
        if: steps.boot_failure.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: dan-api36-retry
          emulator-port: 5556
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/run_android_acceptance.sh

      - name: Require passing PTY acceptance
        if: always() && steps.acceptance.outcome != 'skipped'
        env:
          FIRST: ${{ steps.acceptance.outcome }}
          RETRY: ${{ steps.acceptance_retry.outcome }}
        run: |
          [[ "$FIRST" == success || "$RETRY" == success ]] || {
            echo "::error::Android 16 PTY acceptance did not pass."
            exit 1
          }

      - name: Upload instrumented results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/dan-terminal-emulator-diagnostics/**
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-dev-debug-unverified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
