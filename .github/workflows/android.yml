name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: python3 scripts/validate_source_tree.py
      - name: Check bootstrap script
        run: bash -n scripts/bootstrap_gradle_wrapper.sh app/src/main/assets/bootstrap/dan_bootstrap.sh
      - name: Check whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # v3 asks sdkmanager for the retired "tools" package and fails before build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Generate checksum-verified Gradle wrapper
        run: bash scripts/bootstrap_gradle_wrapper.sh

      - name: Upload verified Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

      - name: Compile and unit test
        run: ./gradlew :app:assembleDebug testDebugUnitTest lintDebug --continue --stacktrace --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
