name: Android CI

on:
  push:
    branches: [ main, develop, 'build/**', 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_source_tree.py
      - run: bash -n scripts/bootstrap_gradle_wrapper.sh app/src/main/assets/bootstrap/dan_bootstrap.sh
      - run: git diff --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Bootstrap missing wrapper
        run: ./scripts/bootstrap_gradle_wrapper.sh
      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: ./gradlew clean :app:assembleDebug --stacktrace --warning-mode all
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-build-evidence
          path: |
            **/build/reports/
            **/build/test-results/
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: warn
      - name: Require all Android checks
        if: always()
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          test "$ASSEMBLE_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$LINT_OUTCOME" = success
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dan-terminal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
